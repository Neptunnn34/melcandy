services:
  - type: web
    name: melcandy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: 1
      - key: SPOTIFY_REDIRECT_URI
        value: https://melcandy.onrender.com/api/spotify/callback
